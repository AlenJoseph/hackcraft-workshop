server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html index.php;

    # Flag 1: Hidden in HTTP response header
    add_header X-Secret-Flag "HACKCRAFT{http_headers_hide_secrets}" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Disable directory listing (students must brute-force paths)
    autoindex off;
}
